# Playground deployment. Set TYPESENSE_URL and TYPESENSE_API_KEY in the Netlify site environment.
[build]
  # The Nitro netlify preset writes the site to playground/dist and the server function to
  # playground/.netlify; Netlify only looks for the function in the repository root.
  command = "pnpm dev:prepare && pnpm dev:build && rm -rf .netlify && cp -R playground/.netlify .netlify"
  publish = "playground/dist"

[build.environment]
  NODE_VERSION = "24"
  NITRO_PRESET = "netlify"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Nuxt inlines its payload script and Nuxt UI injects styles, so 'unsafe-inline' is required.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
